# Generic metadata about this project
name: flows
prefect-version: 3.8.8

# build section allows you to manage and build docker images
build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.4.0
      image_name: "{{ $DOCKER_IMAGE_NAME }}"
      tag: "{{ get-commit-hash.stdout }}"
      dockerfile: Dockerfile
      path: 04-deployment/batch/

# push section allows you to manage if and how this project is uploaded to remote locations
push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.4.0
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/rjafarau/mlops-zoomcamp.git
      branch: main

# the definitions section allows you to define reusable components for your deployments
definitions:
  tags: &common_tags
    - "k8s"
    - "{{ get-commit-hash.stdout }}"
  work_pool: &common_work_pool
    name: "k8s-pool"
    job_variables:
      image: "{{ build-image.image }}"
      image_pull_policy: IfNotPresent
      image_pull_secrets:
        - name: regcred
      env:
        MLFLOW_TRACKING_URI: "{{ $MLFLOW_TRACKING_URI }}"
        MLFLOW_S3_ENDPOINT_URL: "{{ $MLFLOW_S3_ENDPOINT_URL }}"
        AWS_ACCESS_KEY_ID: "{{ prefect.blocks.aws-credentials.my-aws-creds.aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ prefect.blocks.aws-credentials.my-aws-creds.aws_secret_access_key }}"
        AWS_DEFAULT_REGION: "{{ prefect.blocks.aws-credentials.my-aws-creds.region_name }}"

# the deployments section allows you to provide configuration for deploying flows
deployments:
  - name: k8s-deployment
    tags: *common_tags
    entrypoint: 04-deployment/batch/src/flows/score.py:run
    parameters:
      taxi_type: green
      year: 2021
      month: 2
      model_id: m-205aad2b19454838af2cfe5644624f7e
    work_pool: *common_work_pool
