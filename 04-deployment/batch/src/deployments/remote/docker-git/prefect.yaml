---
# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: docker-git
prefect-version: 3.7.8

# build section allows you to manage and build docker images
build:
- prefect_docker.deployments.steps.build_docker_image:
    id: build_image
    requires: prefect-docker>=0.3.1
    image_name: my_image
    tag: latest
    dockerfile: Dockerfile
    path: 04-deployment/batch/

# push section allows you to manage if and how this project
# is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning
# this project in remote locations
pull:
- prefect.deployments.steps.set_working_directory:
    directory: /app
- prefect.deployments.steps.git_clone:
    repository: https://github.com/rjafarau/mlops-zoomcamp.git
    branch: main


# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: docker-git-deployment
  version: null
  tags: []
  description: null
  schedule: {}
  flow_name: null
  entrypoint: 04-deployment/batch/src/flows/score.py:run
  parameters:
    taxi_type: green
    year: 2021
    month: 2
    model_id: m-205aad2b19454838af2cfe5644624f7e
  work_pool:
    name: docker-pool
    work_queue_name: null
    job_variables:
      image: "{{ build_image.image }}"
      image_pull_policy: Never
      env:
        MLFLOW_TRACKING_URI": "{{ $MLFLOW_TRACKING_URI }}"
        MLFLOW_S3_ENDPOINT_URL: "{{ $MLFLOW_S3_ENDPOINT_URL }}"
        AWS_ACCESS_KEY_ID: "{{ prefect.blocks.minio-credentials.my-minio-creds.minio_root_user }}"
        AWS_SECRET_ACCESS_KEY: "{{ prefect.blocks.minio-credentials.my-minio-creds.minio_root_password }}"
      networks:
        - mlops-zoomcamp-network
      auto_remove: true
