services:
  ### JUPYTER ###

  jupyter-lab:
    build:
      context: ./docker/jupyter-lab
      args:
        UV_SYNC_OPTIONS: "--locked"
    container_name: jupyter-lab
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      PREFECT_API_URL: ${PREFECT_API_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    ports:
      - "127.0.0.1:${JUPYTER_PORT}:${JUPYTER_PORT}"
    volumes:
      - ./01-intro:/app/01-intro
      - ./02-experiment-tracking:/app/02-experiment-tracking
      - ./03-orchestration:/app/03-orchestration
      - ./04-deployment:/app/04-deployment
    command: [
      "jupyter", "lab",
      "--ip", "${JUPYTER_HOST}",
      "--port", "${JUPYTER_PORT}",
      "--no-browser"
    ]

  ### MLFLOW ###

  mlflow-postgres:
    image: postgres:15.17-bookworm
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${MLFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MLFLOW_POSTGRES_DB}
    volumes:
      - ./docker/mlflow/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_POSTGRES_USER} -d ${MLFLOW_POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow-rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: mlflow-rustfs
    environment:
      RUSTFS_ADDRESS: ${MLFLOW_RUSTFS_HOST}:${MLFLOW_RUSTFS_PORT}
      RUSTFS_REGION: ${AWS_DEFAULT_REGION}
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: ${MLFLOW_RUSTFS_CONSOLE_ENABLE}
      RUSTFS_CONSOLE_ADDRESS: ${MLFLOW_RUSTFS_HOST}:${MLFLOW_RUSTFS_CONSOLE_PORT}
    ports:
      - "127.0.0.1:${MLFLOW_RUSTFS_CONSOLE_PORT}:${MLFLOW_RUSTFS_CONSOLE_PORT}"
    volumes:
      - ./docker/mlflow/rustfs/data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'curl -s http://127.0.0.1:${MLFLOW_RUSTFS_PORT}/health | grep -q ''"status":"ok"''']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mlflow-create-bucket:
    image: amazon/aws-cli:2.37.11
    container_name: mlflow-create-bucket
    depends_on:
      mlflow-rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        set -e;
        echo 'Waiting for S3 gateway getting ready...';
        if aws --endpoint-url=${MLFLOW_S3_ENDPOINT_URL} s3api head-bucket --bucket ${MLFLOW_RUSTFS_BUCKET} 2>/dev/null; then
          echo 'Bucket ${MLFLOW_RUSTFS_BUCKET} already exists. Skipping creation.';
        else
          echo 'Creating bucket ${MLFLOW_RUSTFS_BUCKET}...';
          aws --endpoint-url=${MLFLOW_S3_ENDPOINT_URL} s3api create-bucket --bucket ${MLFLOW_RUSTFS_BUCKET} --region ${AWS_DEFAULT_REGION};
        fi
      "
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_S3_ADDRESSING_STYLE: path
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      MLFLOW_RUSTFS_BUCKET: ${MLFLOW_RUSTFS_BUCKET}
    restart: "no"

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v3.14.0-full
    container_name: mlflow-server
    depends_on:
      mlflow-postgres:
        condition: service_healthy
      mlflow-rustfs:
        condition: service_healthy
      mlflow-create-bucket:
        condition: service_completed_successfully
    environment:
      # Backend store URI built from vars
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}
      # S3/RustFS settings
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      MLFLOW_ARTIFACTS_DESTINATION: ${MLFLOW_ARTIFACTS_DESTINATION}
      MLFLOW_S3_IGNORE_TLS: "true"
      # Server host/port
      MLFLOW_HOST: ${MLFLOW_HOST}
      MLFLOW_PORT: ${MLFLOW_PORT}
      # Security settings
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS}
    ports:
      - "127.0.0.1:${MLFLOW_PORT}:${MLFLOW_PORT}"
    command: [
      "mlflow", "server"
    ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${MLFLOW_PORT}/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

### PREFECT ###

  prefect-postgres:
    image: postgres:15.17-bookworm
    container_name: prefect-postgres
    environment:
      POSTGRES_USER: ${PREFECT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PREFECT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PREFECT_POSTGRES_DB}
    volumes:
      - ./docker/prefect/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PREFECT_POSTGRES_USER} -d ${PREFECT_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-redis:
    image: redis:8.2.7-bookworm
    container_name: prefect-redis
    volumes:
      - ./docker/prefect/redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3.8.8-python3.14
    container_name: prefect-server
    depends_on:
      prefect-postgres:
        condition: service_healthy
      prefect-redis:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_API_DATABASE_CONNECTION_URL}
      PREFECT_SERVER_API_HOST: ${PREFECT_SERVER_API_HOST}
      PREFECT_SERVER_API_PORT: ${PREFECT_SERVER_API_PORT}
      PREFECT_MESSAGING_BROKER: ${PREFECT_MESSAGING_BROKER}
      PREFECT_MESSAGING_CACHE: ${PREFECT_MESSAGING_CACHE}
      PREFECT_REDIS_MESSAGING_HOST: ${PREFECT_REDIS_MESSAGING_HOST}
      PREFECT_REDIS_MESSAGING_PORT: ${PREFECT_REDIS_MESSAGING_PORT}
      PREFECT_REDIS_MESSAGING_DB: ${PREFECT_REDIS_MESSAGING_DB}
      PREFECT_SERVER_ANALYTICS_ENABLED: ${PREFECT_SERVER_ANALYTICS_ENABLED}
    command: prefect server start --no-services
    ports:
      - "127.0.0.1:${PREFECT_SERVER_API_PORT}:${PREFECT_SERVER_API_PORT}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:${PREFECT_SERVER_API_PORT}/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prefect-services:
    image: prefecthq/prefect:3.8.8-python3.14
    container_name: prefect-services
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_API_DATABASE_CONNECTION_URL}
      PREFECT_MESSAGING_BROKER: ${PREFECT_MESSAGING_BROKER}
      PREFECT_MESSAGING_CACHE: ${PREFECT_MESSAGING_CACHE}
      PREFECT_REDIS_MESSAGING_HOST: ${PREFECT_REDIS_MESSAGING_HOST}
      PREFECT_REDIS_MESSAGING_PORT: ${PREFECT_REDIS_MESSAGING_PORT}
      PREFECT_REDIS_MESSAGING_DB: ${PREFECT_REDIS_MESSAGING_DB}
    command: prefect server services start

  # prefect-worker:
