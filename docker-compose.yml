services:
  ### JUPYTER ###

  jupyter-lab:
    build:
      context: ./docker/jupyter-lab
      args:
        UV_SYNC_OPTIONS: "--locked"
    container_name: jupyter-lab
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MLFLOW_S3_ENDPOINT_URL: ${AWS_ENDPOINT_URL_S3}
      PREFECT_API_URL: ${PREFECT_API_URL}
      EVIDENTLY_WORKSPACE_URL: ${EVIDENTLY_WORKSPACE_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    ports:
      - "127.0.0.1:${JUPYTER_PORT}:${JUPYTER_PORT}"
    volumes:
      - ./01-intro:/app/01-intro
      - ./02-experiment-tracking:/app/02-experiment-tracking
      - ./03-orchestration:/app/03-orchestration
      - ./04-deployment:/app/04-deployment
      - ./05-monitoring:/app/05-monitoring
    command: [
      "jupyter", "lab",
      "--ip", "${JUPYTER_HOST}",
      "--port", "${JUPYTER_PORT}",
      "--no-browser"
    ]

  ### RUSTFS ###

  rustfs-server:
    image: rustfs/rustfs:1.0.1
    container_name: rustfs-server
    environment:
      RUSTFS_ADDRESS: ${RUSTFS_HOST}:${RUSTFS_PORT}
      RUSTFS_REGION: ${AWS_DEFAULT_REGION}
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE}
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_HOST}:${RUSTFS_CONSOLE_PORT}
    ports:
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT}:${RUSTFS_CONSOLE_PORT}"
    volumes:
      - ./docker/rustfs/server/data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'curl -s http://127.0.0.1:${RUSTFS_PORT}/health | grep -q ''"status":"ok"''']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rustfs-create-buckets:
    image: amazon/aws-cli:2.37.11
    container_name: rustfs-create-buckets
    depends_on:
      rustfs-server:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3}
      AWS_S3_ADDRESSING_STYLE: path
      BUCKETS: ${MLFLOW_BUCKET} ${EVIDENTLY_BUCKET}
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        set -e
        echo "Waiting for S3 gateway getting ready..."
        for bucket in $$BUCKETS
        do
          if aws s3api head-bucket --bucket $$bucket 2>/dev/null
          then
            echo "Bucket $$bucket already exists. Skipping creation."
          else
            echo "Creating bucket $$bucket..."
            aws s3api create-bucket --bucket $$bucket
          fi
        done
    restart: "no"

  ### MLFLOW ###

  mlflow-postgres:
    image: postgres:18.6-bookworm
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${MLFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MLFLOW_POSTGRES_DB}
    volumes:
      - ./docker/mlflow/postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_POSTGRES_USER} -d ${MLFLOW_POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v3.14.0-full
    container_name: mlflow-server
    depends_on:
      mlflow-postgres:
        condition: service_healthy
      rustfs-server:
        condition: service_healthy
      rustfs-create-buckets:
        condition: service_completed_successfully
    environment:
      # Backend store URI built from vars
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}
      # S3/RustFS settings
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      MLFLOW_S3_ENDPOINT_URL: ${AWS_ENDPOINT_URL_S3}
      MLFLOW_ARTIFACTS_DESTINATION: ${MLFLOW_ARTIFACTS_DESTINATION}
      MLFLOW_S3_IGNORE_TLS: "true"
      # Server host/port
      MLFLOW_HOST: ${MLFLOW_HOST}
      MLFLOW_PORT: ${MLFLOW_PORT}
      # Security settings
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS}
    ports:
      - "127.0.0.1:${MLFLOW_PORT}:${MLFLOW_PORT}"
    command: [
      "mlflow", "server"
    ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${MLFLOW_PORT}/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

### PREFECT ###

  prefect-postgres:
    image: postgres:18.6-bookworm
    container_name: prefect-postgres
    environment:
      POSTGRES_USER: ${PREFECT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PREFECT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PREFECT_POSTGRES_DB}
    volumes:
      - ./docker/prefect/postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PREFECT_POSTGRES_USER} -d ${PREFECT_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-redis:
    image: redis:8.2.7-bookworm
    container_name: prefect-redis
    volumes:
      - ./docker/prefect/redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3.8.8-python3.14
    container_name: prefect-server
    depends_on:
      prefect-postgres:
        condition: service_healthy
      prefect-redis:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_API_DATABASE_CONNECTION_URL}
      PREFECT_SERVER_API_HOST: ${PREFECT_SERVER_API_HOST}
      PREFECT_SERVER_API_PORT: ${PREFECT_SERVER_API_PORT}
      PREFECT_MESSAGING_BROKER: ${PREFECT_MESSAGING_BROKER}
      PREFECT_MESSAGING_CACHE: ${PREFECT_MESSAGING_CACHE}
      PREFECT_REDIS_MESSAGING_HOST: ${PREFECT_REDIS_MESSAGING_HOST}
      PREFECT_REDIS_MESSAGING_PORT: ${PREFECT_REDIS_MESSAGING_PORT}
      PREFECT_REDIS_MESSAGING_DB: ${PREFECT_REDIS_MESSAGING_DB}
      PREFECT_SERVER_ANALYTICS_ENABLED: ${PREFECT_SERVER_ANALYTICS_ENABLED}
    command: prefect server start --no-services
    ports:
      - "127.0.0.1:${PREFECT_SERVER_API_PORT}:${PREFECT_SERVER_API_PORT}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:${PREFECT_SERVER_API_PORT}/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prefect-services:
    image: prefecthq/prefect:3.8.8-python3.14
    container_name: prefect-services
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_API_DATABASE_CONNECTION_URL}
      PREFECT_MESSAGING_BROKER: ${PREFECT_MESSAGING_BROKER}
      PREFECT_MESSAGING_CACHE: ${PREFECT_MESSAGING_CACHE}
      PREFECT_REDIS_MESSAGING_HOST: ${PREFECT_REDIS_MESSAGING_HOST}
      PREFECT_REDIS_MESSAGING_PORT: ${PREFECT_REDIS_MESSAGING_PORT}
      PREFECT_REDIS_MESSAGING_DB: ${PREFECT_REDIS_MESSAGING_DB}
    command: prefect server services start

  ### EVIDENTLY ###

  evidently-server:
    build:
      context: ./docker/evidently
    container_name: evidently-server
    depends_on:
      rustfs-server:
        condition: service_healthy
      rustfs-create-buckets:
        condition: service_completed_successfully
    environment:
      FSSPEC_S3_KEY: ${AWS_ACCESS_KEY_ID}
      FSSPEC_S3_SECRET: ${AWS_SECRET_ACCESS_KEY}
      FSSPEC_S3_ENDPOINT_URL: ${AWS_ENDPOINT_URL_S3}
    ports:
      - "127.0.0.1:${EVIDENTLY_PORT}:${EVIDENTLY_PORT}"
    command: [
      "evidently", "ui",
      "--host", "${EVIDENTLY_HOST}",
      "--port", "${EVIDENTLY_PORT}",
      "--workspace", "s3://${EVIDENTLY_BUCKET}/workspace"
    ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:${EVIDENTLY_PORT}/api/version', timeout=1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ### MONITORING ###

  monitoring-postgres:
    image: postgres:18.6-bookworm
    container_name: monitoring-postgres
    environment:
      POSTGRES_USER: ${MONITORING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MONITORING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MONITORING_POSTGRES_DB}
    volumes:
      - ./docker/monitoring/postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MONITORING_POSTGRES_USER} -d ${MONITORING_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  monitoring-adminer:
    image: adminer:6.1.2-standalone
    container_name: monitoring-adminer
    depends_on:
      monitoring-postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: ${MONITORING_ADMINER_DEFAULT_SERVER}
    ports:
      - "127.0.0.1:${MONITORING_ADMINER_PORT}:${MONITORING_ADMINER_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MONITORING_ADMINER_PORT}/"]
      interval: 5s
      timeout: 5s
      retries: 5

  monitoring-grafana:
    image: grafana/grafana-enterprise:13.0.11
    container_name: monitoring-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${MONITORING_GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${MONITORING_GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_HTTP_ADDR: ${MONITORING_GF_SERVER_HTTP_ADDR}
      GF_SERVER_HTTP_PORT: ${MONITORING_GF_SERVER_HTTP_PORT}
      GF_ANALYTICS_REPORTING_ENABLED: ${MONITORING_GF_ANALYTICS_REPORTING_ENABLED}
    ports:
      - "127.0.0.1:${MONITORING_GF_SERVER_HTTP_PORT}:${MONITORING_GF_SERVER_HTTP_PORT}"
    volumes:
      - ./docker/monitoring/grafana/data:/var/lib/grafana
      - ./05-monitoring/config/grafana_datasources.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./05-monitoring/config/grafana_dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./05-monitoring/dashboards:/opt/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${MONITORING_GF_SERVER_HTTP_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

